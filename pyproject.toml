[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dotenv-guard"
description = "Block .env files and flag common secrets before they get committed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kaygaaf" }]
keywords = ["dotenv", "secrets", "git", "pre-commit"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/kaygaaf/dotenv-guard"
Repository = "https://github.com/kaygaaf/dotenv-guard"

[project.scripts]
dotenv-guard = "dotenv_guard.cli:main"

[tool.setuptools.dynamic]
version = { attr = "dotenv_guard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
